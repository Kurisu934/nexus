name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version metadata
        id: meta
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="$MANIFEST_VERSION"
          fi
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $MANIFEST_VERSION"; exit 1
          fi
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"; exit 1
          fi
          node -e "const v=require('./versions.json'); if(!v['$TAG']){console.error('::error::versions.json has no entry for $TAG');process.exit(1)}"
          node -e "const s=require('./schemas/manifest.json'); if(s.latest!=='$TAG'||!s.versions['$TAG']){console.error('::error::schema catalog is not generated for '+ '$TAG');process.exit(1)}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        run: npm run build

      - name: Package plugin zip
        run: |
          zip -j "nexus-${{ steps.meta.outputs.tag }}.zip" main.js manifest.json styles.css

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ steps.meta.outputs.tag }}
          path: |
            main.js
            manifest.json
            styles.css
            nexus-${{ steps.meta.outputs.tag }}.zip
            schemas/${{ steps.meta.outputs.tag }}/cli-tools.json
            schemas/${{ steps.meta.outputs.tag }}/mcp-tools.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            main.js
            manifest.json
            styles.css
            nexus-${{ steps.meta.outputs.tag }}.zip
            schemas/${{ steps.meta.outputs.tag }}/cli-tools.json
            schemas/${{ steps.meta.outputs.tag }}/mcp-tools.json
          generate_release_notes: true

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            nexus-${{ steps.meta.outputs.tag }}.zip
            schemas/${{ steps.meta.outputs.tag }}/cli-tools.json
            schemas/${{ steps.meta.outputs.tag }}/mcp-tools.json
